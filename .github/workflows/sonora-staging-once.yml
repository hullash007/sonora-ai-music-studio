name: SONORA one-time staging deployment
on:
  push:
    branches: [feat/phase-1-library]
    paths: [.github/sonora-staging-start.txt]
permissions:
  contents: read
concurrency:
  group: sonora-staging-one-time-validation
  cancel-in-progress: false
jobs:
  deploy:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify immutable event checkout
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          echo "Expected release SHA: $GITHUB_SHA"
          echo "Actual checkout SHA: $ACTUAL"
          echo "Remote tree SHA: $(git rev-parse HEAD^{tree})"
          test "$ACTUAL" = "$GITHUB_SHA"
      - name: Install explicit Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned CLI in Python 3.12 environment
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python -m venv .validation-venv
          .validation-venv/bin/python -m pip install modal==1.6.4
      - name: Deploy once with watchdog and failure stop
        shell: bash
        env:
          MODAL_TOKEN_ID: ${{ secrets.SONORA_MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.SONORA_MODAL_TOKEN_SECRET }}
        run: .validation-venv/bin/python scripts/deploy_staging_once.py
